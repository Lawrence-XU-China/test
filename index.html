<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审计平台 · UI 原型</title>
<style>
/* ============ 全局变量与重置 ============ */
:root{
  --primary:#2468f2;--primary-dark:#1a4fc4;--primary-bg:#eaf1ff;
  --success:#16a34a;--success-bg:#dcfce7;
  --warn:#d97706;--warn-bg:#fef3c7;
  --danger:#dc2626;--danger-bg:#fee2e2;
  --info:#0891b2;--info-bg:#cffafe;
  --gray:#64748b;--gray-bg:#f1f5f9;
  --text:#1e293b;--text-light:#64748b;--text-lighter:#94a3b8;
  --border:#e2e8f0;--border-dark:#cbd5e1;
  --bg:#f8fafc;--card-bg:#fff;
  --sidebar-w:220px;--topbar-h:56px;
  --radius:8px;--radius-sm:4px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 12px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text);background:var(--bg);line-height:1.5}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-dark);text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none}
ul,ol{list-style:none}
input,select,textarea{font-family:inherit;font-size:14px}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}

/* 侧边栏 */
.sidebar{width:var(--sidebar-w);background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100}
.sidebar-logo{padding:0 18px;height:var(--topbar-h);display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:15px;border-bottom:1px solid #1e293b}
.sidebar-logo .dot{width:24px;height:24px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-group-title{padding:12px 18px 4px;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 18px;color:#cbd5e1;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;transition:.15s}
.sidebar-item:hover{background:#1e293b;color:#fff}
.sidebar-item.active{background:#1e293b;color:#fff;border-left-color:var(--primary)}
.sidebar-item .icon{width:18px;text-align:center;opacity:.85;font-size:15px}
.sidebar-footer{padding:10px 18px;border-top:1px solid #1e293b;font-size:11px;color:#64748b}

/* 主区 */
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh}
.topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:50;gap:16px}
.topbar-breadcrumb{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light)}
.topbar-breadcrumb a{color:var(--text-light)}
.topbar-breadcrumb .sep{color:var(--text-lighter)}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer}
.topbar-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.content{padding:24px;flex:1}
.page-title{font-size:20px;font-weight:600;margin-bottom:4px;color:var(--text)}
.page-subtitle{color:var(--text-light);font-size:13px;margin-bottom:20px}

/* ============ 通用组件 ============ */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;justify-content:between}
.card-header .title{flex:1}
.card-body{padding:18px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--border-dark);background:#fff;color:var(--text);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);color:#fff}
.btn-sm{padding:3px 10px;font-size:12px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-link{border:none;background:none;color:var(--primary);padding:2px 4px}
.btn-link:hover{text-decoration:underline}

/* 标签/徽章 */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:500;line-height:1.6}
.badge-high{background:var(--danger-bg);color:var(--danger)}
.badge-mid{background:var(--warn-bg);color:var(--warn)}
.badge-low{background:var(--info-bg);color:var(--info)}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-gray{background:var(--gray-bg);color:var(--gray)}
.badge-info{background:var(--primary-bg);color:var(--primary)}

/* 状态点 */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-green{background:var(--success)}.dot-yellow{background:var(--warn)}.dot-red{background:var(--danger)}.dot-gray{background:var(--gray)}

/* 表格 */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:10px 12px;background:var(--gray-bg);color:var(--text-light);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:hover td{background:#fafbfc}
.table .link{color:var(--primary);cursor:pointer}
.table .link:hover{text-decoration:underline}

/* 表单 */
.form-row{display:flex;align-items:center;margin-bottom:16px;gap:12px}
.form-label{width:120px;text-align:right;color:var(--text-light);font-size:13px;flex-shrink:0}
.form-label.required::after{content:"*";color:var(--danger);margin-left:3px}
.input,.select,.textarea{flex:1;padding:7px 10px;border:1px solid var(--border-dark);border-radius:var(--radius-sm);font-size:13px;background:#fff}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.textarea{min-height:72px;resize:vertical;font-family:inherit}
.form-hint{color:var(--text-lighter);font-size:12px;margin-left:132px;margin-top:-10px;margin-bottom:14px}

/* 筛选条 */
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-bar .input,.filter-bar .select{width:auto;min-width:140px}
.filter-spacer{flex:1}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-card .label{font-size:12px;color:var(--text-light);margin-bottom:6px}
.stat-card .value{font-size:24px;font-weight:600;color:var(--text)}
.stat-card .trend{font-size:12px;margin-top:4px}
.stat-card .trend.up{color:var(--success)}.stat-card .trend.down{color:var(--danger)}

/* 图表占位（用 div 模拟） */
.chart-box{height:200px;display:flex;align-items:flex-end;justify-content:space-around;padding:10px 0;gap:4px;position:relative}
.chart-bar{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-width:12px;position:relative;transition:.2s;cursor:pointer}
.chart-bar:hover{opacity:.85}
.chart-bar .label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-light);white-space:nowrap}
.chart-bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-light);white-space:nowrap}

/* 横向柱状图 */
.hbar-chart{display:flex;flex-direction:column;gap:8px}
.hbar-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.hbar-row .name{width:100px;color:var(--text-light);text-align:right;flex-shrink:0}
.hbar-row .track{flex:1;height:18px;background:var(--gray-bg);border-radius:3px;overflow:hidden}
.hbar-row .fill{height:100%;border-radius:3px}
.hbar-row .num{width:36px;text-align:right;font-weight:600;flex-shrink:0}

/* 饼图（用 conic-gradient 模拟） */
.pie{width:140px;height:140px;border-radius:50%;margin:0 auto}
.pie-legend{display:flex;flex-direction:column;gap:6px;font-size:12px;margin-top:12px}
.pie-legend .row{display:flex;align-items:center;gap:6px}
.pie-legend .swatch{width:12px;height:12px;border-radius:2px}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:9px 16px;cursor:pointer;color:var(--text-light);font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
.drawer-mask.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;background:#fff;z-index:201;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.1)}
.drawer.show{transform:translateX(0)}
.drawer-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between}
.drawer-header .title{flex:1;font-weight:600;font-size:15px}
.drawer-close{font-size:20px;color:var(--gray);cursor:pointer;line-height:1}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* 分段控件（时间范围） */
.seg{display:inline-flex;border:1px solid var(--border-dark);border-radius:var(--radius-sm);overflow:hidden}
.seg button{padding:5px 14px;font-size:12.5px;color:var(--text-light);background:#fff;border:none;border-right:1px solid var(--border-dark)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--primary);color:#fff}

/* 空状态 */
.empty{text-align:center;padding:40px;color:var(--text-lighter);font-size:13px}

/* 面包屑容器内的当前 */
.breadcrumb-current{color:var(--text);font-weight:500}

/* 代码块 */
.code-block{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:6px;font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre}
.code-block .ln{color:#64748b;margin-right:12px;user-select:none}
.code-block .hl{background:rgba(220,38,38,.25);display:block;margin:0 -14px;padding:0 14px}
.code-block .add{color:#4ade80}.code-block .del{color:#f87171}

/* 复选框 */
.checkbox{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.checkbox input{margin:0}

/* 分页 */
.pagination{display:flex;gap:4px;justify-content:flex-end;margin-top:14px;align-items:center;font-size:13px;color:var(--text-light)}
.pagination button{padding:4px 10px;border:1px solid var(--border-dark);border-radius:var(--radius-sm);background:#fff;font-size:12.5px}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{color:var(--text-lighter);cursor:not-allowed}

/* 详情字段网格 */
.field-grid{display:grid;grid-template-columns:130px 1fr 130px 1fr;gap:10px 14px;font-size:13px}
.field-grid .k{color:var(--text-light)}
.field-grid .v{color:var(--text)}

/* 登录页 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)}
.login-box{width:380px;background:#fff;border-radius:12px;padding:36px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.login-title{text-align:center;font-size:20px;font-weight:600;margin-bottom:6px}
.login-sub{text-align:center;color:var(--text-light);font-size:13px;margin-bottom:28px}
.login-logo{width:48px;height:48px;background:var(--primary);border-radius:10px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700}
.login-box .form-label{width:auto;display:block;text-align:left;margin-bottom:6px}
.login-box .input{width:100%}

/* 实用 */
.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}.gap-3{gap:12px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-sm{font-size:12.5px}.text-gray{color:var(--text-light)}.text-right{text-align:right}
.font-mono{font-family:"SF Mono",Consolas,Menlo,monospace}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.hidden{display:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.section-title{font-size:14px;font-weight:600;margin:18px 0 10px;color:var(--text)}
hr.divider{border:none;border-top:1px solid var(--border);margin:16px 0}

/* 提示框 */
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.alert-info{background:var(--primary-bg);color:var(--primary-dark)}
.alert-warn{background:var(--warn-bg);color:var(--warn)}
.alert-danger{background:var(--danger-bg);color:var(--danger)}

</style>
</head>

/* ============================================================
   辅助函数

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const go = (hash)=>{ location.hash = hash; };
function severityBadge(s){ const m={High:'badge-high',Mid:'badge-mid',Low:'badge-low'}; return `<span class="badge ${m[s]||''}">${s==='High'?'高危':s==='Mid'?'中危':'低危'}</span>` }
function statusBadge(s){
  const m={'成功':'badge-success','部分成功':'badge-warn','失败':'badge-danger','已取消':'badge-gray','执行中':'badge-info','排队中':'badge-gray','待执行':'badge-gray'};
  const dot={'成功':'dot-green','部分成功':'dot-yellow','失败':'dot-red','已取消':'dot-gray','执行中':'dot-green','排队中':'dot-gray','待执行':'dot-gray'};
  return `<span class="badge ${m[s]||''}"><span class="dot ${dot[s]||''}" style="margin-right:5px"></span>${s}</span>`;
}
function issueStatusBadge(s){
  const m={'待处理':'badge-gray','已确认':'badge-info','修复中':'badge-warn','已修复':'badge-info','已关闭':'badge-success','已忽略':'badge-gray'};
  return `<span class="badge ${m[s]||''}">${s}</span>`;
}
function permBadge(p){ const m={EXECUTE:['badge-info','创建任务与执行'],WRITE:['badge-warn','写'],READ:['badge-gray','读']}; const [c,n]=m[p]||['badge-gray',p]; return `<span class="badge ${c}">${n}</span>` }
function findProject(id){ return DB.projects.find(p=>p.id===id) }
function findRepo(id){ return DB.repos.find(r=>r.id===id) }
function reposOf(pid){ return DB.repos.filter(r=>r.projectId===pid) }
function tasksOfRepo(rid){ return DB.tasks.filter(t=>t.repoId===rid) }
function tasksOfProject(pid){ return DB.tasks.filter(t=>t.projectId===pid) }
function issuesOfRepo(rid){ return DB.issues.filter(i=>i.repoId===rid) }
function issuesOfProject(pid){ return DB.issues.filter(i=>i.projectId===pid) }

/* 分页渲染 */
function pagination(total, page=1, perPage=10){
  const pages = Math.ceil(total/perPage);
  if(pages<=1) return '';
  let h='<div class="pagination"><span>共 '+total+' 条</span>';
  h+=`<button ${page<=1?'disabled':''}>上一页</button>`;
  for(let i=1;i<=pages;i++) h+=`<button class="${i===page?'active':''}">${i}</button>`;
  h+=`<button ${page>=pages?'disabled':''}>下一页</button>`;
  h+='</div>';
  return h;
}

/* 高亮当前菜单 */
function highlightNav(hash){
  setTimeout(()=>{
    $$('.sidebar-item').forEach(el=>{
      const onclick = el.getAttribute('onclick')||'';
      if(onclick.includes("'"+hash+"'")) el.classList.add('active');
      else el.classList.remove('active');
    });
  },0);
}

/* ============================================================
   路由器
   ============================================================ */
function router(){
  const hash = location.hash.slice(1) || '/dashboard';
  const parts = hash.split('/').filter(Boolean); // 去掉空串
  const root = parts[0]||'dashboard';
  let html='';
  switch(root){
    case 'login': document.getElementById('app').innerHTML = pageLogin(); return;
    case 'dashboard': html = pageDashboard(); break;
    case 'projects':
      if(parts[1] && parts[1]==='new'){ html=pageProjectNew(); break; }
      if(parts[1]){ // /projects/:id
        const pid=parts[1];
        if(parts[2]==='settings'){ html=pageProjectSettings(pid); break; }
        html=pageProjectDetail(pid); break;
      }
      html=pageProjectList(); break;
    case 'repos':
      if(parts[1]){
        const rid=parts[1];
        if(parts[2]==='settings'){ html=pageRepoSettings(rid); break; }
        if(parts[2]==='new-task'){ html=pageTaskNew(rid); break; }
        if(parts[2]==='upload'){ html=pageUpload(rid); break; }
        html=pageRepoDetail(rid); break;
      }
      break;
    case 'tasks':
      if(parts[1]){ html=pageTaskDetail(parts[1]); break; }
      html=pageTaskList(); break;
    case 'issues':
      if(parts[1]){ html=pageIssueDetail(parts[1]); break; }
      html=pageIssueList(); break;
    case 'users': html=pageUsers(); break;
    case 'settings': html=pageSettings(); break;
    default: html=pageDashboard();
  }
  document.getElementById('app').innerHTML = html;
  highlightNav('#/'+root);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', router);

  const totalIssue = DB.projects.reduce((s,p)=>s+p.issueCount.high+p.issueCount.mid+p.issueCount.low,0);
  const highIssue = DB.projects.reduce((s,p)=>s+p.issueCount.high,0);
  const st = DB.taskStats7d;

  // 趋势堆叠柱状图（取最大值归一）
  const maxDay = Math.max(...st.trend.map(d=>d.success+d.partial+d.failed+d.cancelled));
  const trendBars = st.trend.map(d=>{
    const total=d.success+d.partial+d.failed+d.cancelled;
    const h = total/maxDay*100;
    return `<div style="display:flex;flex-direction:column;justify-content:flex-end;height:160px;flex:1;align-items:center">
      <div style="width:60%;display:flex;flex-direction:column;border-radius:3px 3px 0 0;overflow:hidden;height:${h}%">
        <div style="flex:${d.success};background:var(--success)"></div>
        <div style="flex:${d.partial};background:var(--warn)"></div>
        <div style="flex:${d.failed};background:var(--danger)"></div>
        <div style="flex:${d.cancelled};background:var(--gray)"></div>
      </div>
      <div class="label" style="font-size:11px;color:var(--text-light);margin-top:6px">${d.date}</div>
    </div>`;
  }).join('');

  // 饼图 conic-gradient
  const pie = st;
  const s1=pie.success,p2=pie.partial,p3=pie.failed,p4=pie.cancelled, totalPie=s1+p2+p3+p4;
  const deg = v=> v/totalPie*360;
  const cum=(arr)=>{let s=0;return arr.map(v=>s+=v)};
  const [c1,c2,c3,c4]=cum([deg(s1),deg(p2),deg(p3),deg(p4)]);
  const pieStyle = `background:conic-gradient(var(--success) 0 ${c1}deg, var(--warn) ${c1}deg ${c2}deg, var(--danger) ${c2}deg ${c3}deg, var(--gray) ${c3}deg 360deg)`;

  // 类型分布横向柱状
  const maxType = Math.max(...st.byType.map(t=>t.n));
  const typeBars = st.byType.map(t=>{
    const colors=['var(--primary)','var(--info)','var(--success)','var(--warn)','var(--gray)'];
    return `<div class="hbar-row"><div class="name">${t.name}</div><div class="track"><div class="fill" style="width:${t.n/maxType*100}%;background:${colors[st.byType.indexOf(t)]}"></div></div><div class="num">${t.n}</div></div>`;
  }).join('');

  const latestTasks = DB.tasks.slice(0,6).map(t=>`
    <tr>
      <td><a class="link" onclick="go('#/tasks/${t.id}')">${t.name}</a></td>
      <td><a class="link" onclick="go('#/repos/${t.repoId}')">${t.repoName}</a></td>

      <td>${statusBadge(t.status)}</td>
      <td>${t.issueCount?`发现 ${t.issueCount}`:'-'}</td>
      <td class="text-gray text-sm">${t.created}</td>
    </tr>`).join('');

  return layout(`
    <div class="page-title">首页看板</div>
    <div class="page-subtitle">全局总览 · 跨所有项目的任务与漏洞概览</div>

      <div class="stat-card"><div class="label">代码仓库</div><div class="value">${totalRepo}</div><div class="trend up">近7天 ${totalTask} 个任务</div></div>
      <div class="stat-card"><div class="label">漏洞总数</div><div class="value">${totalIssue}</div><div class="trend down">高危 ${highIssue} · 待处理 ${DB.issues.filter(i=>i.status==='待处理').length}</div></div>
      <div class="stat-card"><div class="label">近7天任务成功率</div><div class="value">${Math.round(st.success/totalPie*100)}%</div><div class="trend">成功 ${st.success} / 失败 ${st.failed}</div></div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="section-title" style="margin:0">任务执行状态分布</div>
      <div class="seg">
        <button class="active" onclick="mockAlert('已切换到 近7天')">近7天</button>
        <button onclick="mockAlert('已切换到 近30天')">近30天</button>
        <button onclick="mockAlert('打开自定义时间范围选择')">自定义</button>
      </div>
    </div>

    <div class="grid-3 mb-4">
      <div class="card"><div class="card-header"><span class="title">终态状态分布</span></div><div class="card-body" style="display:flex;align-items:center;gap:16px">
        <div class="pie" style="${pieStyle}"></div>
        <div class="pie-legend" style="flex:1">
          <div class="row"><span class="swatch" style="background:var(--success)"></span>成功 <b>${s1}</b> (${Math.round(s1/totalPie*100)}%)</div>
          <div class="row"><span class="swatch" style="background:var(--warn)"></span>部分成功 <b>${p2}</b> (${Math.round(p2/totalPie*100)}%)</div>
          <div class="row"><span class="swatch" style="background:var(--danger)"></span>失败 <b>${p3}</b> (${Math.round(p3/totalPie*100)}%)</div>
          <div class="row"><span class="swatch" style="background:var(--gray)"></span>已取消 <b>${p4}</b> (${Math.round(p4/totalPie*100)}%)</div>
          <div class="row" style="margin-top:6px;color:var(--text-light)">进行中 ${st.running}（未计入）</div>
        </div>

      <div class="card" style="grid-column:span 2"><div class="card-header"><span class="title">任务趋势（按天，堆叠）</span>

function taskTypeBadge(t){
  const srcTag = t.source==='UPLOAD'?'<span class="badge badge-gray">本地上传</span>':'<span class="badge badge-info">Git</span>';
  const cronTag = t.schedule && t.schedule!=='一次性' && t.type==='Corn Review' && t.cronMode ? `<span class="badge badge-warn">${t.cronMode}模式</span>` : '';
  const schedTag = t.schedule!=='一次性'?`<span class="badge badge-info">${t.schedule}</span>`:'';
  return `${srcTag} <span class="badge badge-gray">${t.type}</span> ${cronTag} ${schedTag}`;
}

      <div class="page-subtitle">${severityBadge(i.severity)} ${issueStatusBadge(i.status)} · ${r.name} · 首次发现 ${i.firstSeen} · 最近 ${i.lastSeen} · 出现 ${i.occurrences} 次</div></div>
      <div class="flex gap-2">
        ${i.status==='待处理'?'<button class="btn btn-primary btn-sm" onclick="mockAlert(\'已确认\')">确认问题</button><button class="btn btn-sm" onclick="mockAlert(\'标记误报\')">标记误报</button>':''}
        ${i.status==='已确认'?'<button class="btn btn-primary btn-sm" onclick="mockAlert(\'开始修复\')">开始修复</button>':''}
        <button class="btn btn-sm" onclick="mockAlert('忽略问题（需填原因）')">忽略</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="card"><div class="card-header"><span class="title">问题信息</span></div><div class="card-body">
        <div class="field-grid" style="grid-template-columns:110px 1fr">
          <div class="k">规则ID</div><div class="v font-mono">R-SQL-INJECTION-001</div>
          <div class="k">规则类型</div><div class="v">${i.rule}</div>
          <div class="k">严重级别</div><div class="v">${severityBadge(i.severity)}</div>
          <div class="k">置信度</div><div class="v">${i.confidence}</div>
          <div class="k">所属仓库</div><div class="v"><a class="link" onclick="go('#/repos/${r.id}')">${r.name}</a></div>
          <div class="k">所属项目</div><div class="v">${p.name}</div>
          <div class="k">文件路径</div><div class="v font-mono text-sm">${i.file}</div>
          <div class="k">行号</div><div class="v">${i.startLine}-${i.endLine}</div>
          <div class="k">发现任务</div><div class="v"><a class="link" onclick="go('#/tasks/${i.taskId}')">${t?t.name:'-'}</a></div>
        </div>
      </div></div>

      <div class="card"><div class="card-header"><span class="title">AI 反馈与修复建议</span></div><div class="card-body">
        <div class="section-title">问题描述</div>
        <p class="text-sm">该接口直接将用户传入的 <code>userId</code> 拼接到 SQL 语句中，攻击者可通过构造恶意输入绕过查询条件甚至执行任意 SQL，导致订单数据泄露或篡改。</p>
        <div class="section-title">修复建议 <span class="badge badge-info">置信度 ${i.confidence}</span></div>
        <div class="code-block"><span class="ln">127</span><span class="add">+   String sql = "SELECT * FROM orders WHERE user_id = ?";</span>
<span class="ln">128</span><span class="add">+   PreparedStatement ps = conn.prepareStatement(sql);</span>
<span class="ln">129</span><span class="add">+   ps.setString(1, userId);</span>
<span class="ln">130</span><span class="add">+   ResultSet rs = ps.executeQuery();</span></div>
        <button class="btn btn-sm mt-3">复制修复代码</button>
      </div></div>
    </div>

    <div class="card mt-4"><div class="card-header"><span class="title">代码上下文（前后各10行，问题行高亮）</span></div><div class="card-body">
      <div class="code-block">${codeHtml}</div>
      <div class="flex gap-2 mt-3"><button class="btn btn-sm">复制代码片段</button><button class="btn btn-sm">在新标签打开文件</button></div>
    </div></div>

    <div class="card mt-4"><div class="card-header"><span class="title">操作历史</span></div>
      <table class="table"><thead><tr><th>时间</th><th>操作</th><th>操作人</th><th>备注</th></tr></thead>
      <tbody>
        <tr><td class="text-sm">${i.firstSeen} 14:22</td><td>首次发现</td><td>系统（OCR）</td><td class="text-gray">任务 ${i.taskId}</td></tr>
        ${i.status!=='待处理'?`<tr><td class="text-sm">2026-08-13 09:00</td><td>确认问题</td><td>王强</td><td>已确认为真实漏洞</td></tr>`:''}
        ${i.status==='已忽略'?`<tr><td class="text-sm">${i.lastSeen}</td><td>标记忽略</td><td>赵敏</td><td>原因：${i.ignoreReason||'-'}</td></tr>`:''}
      </tbody></table>
    </div>
  `, [{hash:'#/issues',label:'漏洞管理'},{hash:'#/issues/'+iid,label:i.rule}]);
}

/* ============================================================
   页面：用户管理
   ============================================================ */
function pageUsers(){
  const rows = DB.users.map(u=>`<tr>
    <td><div class="flex items-center gap-2"><div class="topbar-avatar" style="width:28px;height:28px;font-size:11px">${u.name[0]}</div><div><div>${u.name}</div><div class="text-gray text-sm">${u.email}</div></div></div></td>
    <td>${u.role==='系统管理员'?'<span class="badge badge-info">系统管理员</span>':'<span class="badge badge-gray">普通用户</span>'}</td>
    <td>${u.status==='启用'?'<span class="badge badge-success">启用</span>':'<span class="badge badge-danger">禁用</span>'}</td>
    <td class="text-gray text-sm">${u.lastLogin}</td>
    <td class="text-right">
      <button class="btn-link" onclick="mockAlert('编辑 ${u.name}')">编辑</button>
      <button class="btn-link" onclick="mockAlert('重置密码')">重置密码</button>
      ${u.status==='启用'?`<button class="btn-link" style="color:var(--danger)" onclick="mockAlert('禁用用户')">禁用</button>`:`<button class="btn-link" onclick="mockAlert('启用用户')">启用</button>`}
    </td>
  </tr>`).join('');

  return layout(`
    <div class="flex" style="justify-content:space-between;align-items:flex-start">
      <div><div class="page-title">用户管理</div><div class="page-subtitle">管理平台用户与系统管理员角色</div></div>
      <button class="btn btn-primary" onclick="mockAlert('打开新建用户')">+ 新建用户</button>
    </div>
    <div class="card">
      <div class="filter-bar">
        <input class="input" placeholder="用户名/邮箱" style="min-width:200px">
        <select class="select"><option>全部角色</option><option>系统管理员</option><option>普通用户</option></select>
        <select class="select"><option>全部状态</option><option>启用</option><option>禁用</option></select>
        <div class="filter-spacer"></div>
      </div>
      <table class="table">
        <thead><tr><th>用户</th><th>角色</th><th>状态</th><th>最近登录</th><th class="text-right">操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="alert alert-info mt-3"><b>角色说明：</b>系统管理员是全局超管（管理用户/系统配置/所有项目）；其他权限均在<b>项目级</b>和<b>仓库级</b>按用户授权。</div>
  `, [{hash:'#/users',label:'用户管理'}]);
}

/* ============================================================
   页面：基础设置
   ============================================================ */
function pageSettings(){
  const llmRows = DB.llmConfigs.map(l=>`<tr>
    <td>${l.isDefault?'<span class="badge badge-info">默认</span> '+l.provider:l.provider}</td>
    <td>${l.model}</td>
    <td class="font-mono text-sm truncate">${l.endpoint}</td>
    <td>${l.timeout}s</td>
    <td>${l.status==='启用'?'<span class="badge badge-success">启用</span>':'<span class="badge badge-gray">禁用</span>'}</td>
    <td class="text-gray text-sm">${l.lastTest}</td>
    <td class="text-right">
      <button class="btn-link" onclick="mockAlert('测试 ${l.provider} 连接')">测试</button>
      <button class="btn-link" onclick="mockAlert('编辑')">编辑</button>
      ${l.isDefault?'':`<button class="btn-link" onclick="mockAlert('设为默认')">设为默认</button>`}
    </td>
  </tr>`).join('');

  return layout(`
    <div class="page-title">基础设置</div><div class="page-subtitle">系统级配置 · LLM 提供商、全局规则、Token 配额</div>

    <div class="tabs">
      <div class="tab active" onclick="showSetTab('llm')">LLM 配置</div>
      <div class="tab" onclick="showSetTab('rule')">全局规则</div>
      <div class="tab" onclick="showSetTab('token')">Token 配额</div>
      <div class="tab" onclick="showSetTab('sys')">系统参数</div>
    </div>

    <div id="set-llm">
      <div class="card">
        <div class="card-header"><span class="title">LLM 提供商 (${DB.llmConfigs.length})</span>
          <button class="btn btn-primary btn-sm" onclick="mockAlert('添加 LLM 提供商')">+ 添加提供商</button></div>
        <table class="table">
          <thead><tr><th>提供商</th><th>模型</th><th>端点</th><th>超时</th><th>状态</th><th>最近测试</th><th class="text-right">操作</th></tr></thead>
          <tbody>${llmRows}</tbody>
        </table>
      </div>
      <div class="alert alert-info mt-3"><b>Token 计量说明：</b>第一阶段直接读取 OCR 原生任务级 Token 汇总，平台用执行配置快照补充供应商/模型信息；平台自身生成报告的用量<b>单独统计</b>。</div>
    </div>

    <div id="set-rule" class="hidden"><div class="card"><div class="card-body">
      <div class="section-title">全局规则集</div>
      <table class="table"><thead><tr><th>规则</th><th>类别</th><th>严重级别</th><th>状态</th><th class="text-right">操作</th></tr></thead>
        <tbody>
          <tr><td>SQL注入检测</td><td>注入</td><td>${severityBadge('High')}</td><td><span class="badge badge-success">启用</span></td><td class="text-right"><button class="btn-link">编辑</button></td></tr>
          <tr><td>XSS漏洞检测</td><td>注入</td><td>${severityBadge('High')}</td><td><span class="badge badge-success">启用</span></td><td class="text-right"><button class="btn-link">编辑</button></td></tr>
          <tr><td>硬编码密钥</td><td>配置</td><td>${severityBadge('High')}</td><td><span class="badge badge-success">启用</span></td><td class="text-right"><button class="btn-link">编辑</button></td></tr>
          <tr><td>空指针风险</td><td>可靠性</td><td>${severityBadge('Mid')}</td><td><span class="badge badge-success">启用</span></td><td class="text-right"><button class="btn-link">编辑</button></td></tr>
        </tbody></table>
      <button class="btn btn-primary mt-3">+ 新建规则</button>
    </div></div></div>

    <div id="set-token" class="hidden"><div class="card"><div class="card-body">
      <div class="form-row"><label class="form-label">全局日 Token 上限</label><input class="input" value="10000000" style="width:200px"><span class="text-gray text-sm">tokens/天</span></div>
      <div class="form-row"><label class="form-label">单任务上限</label><input class="input" value="500000" style="width:200px"></div>
      <div class="form-row"><label class="form-label">超限策略</label><select class="select" style="width:240px"><option>排队等待次日</option><option>拒绝新任务</option><option>仅告警不限制</option></select></div>
      <button class="btn btn-primary">保存</button>
    </div></div></div>

    <div id="set-sys" class="hidden"><div class="card"><div class="card-body">
      <div class="form-row"><label class="form-label">会话有效期</label><input class="input" value="8" style="width:100px"><span class="text-gray text-sm">小时</span></div>
      <div class="form-row"><label class="form-label">登录失败锁定</label><input class="input" value="5" style="width:100px"><span class="text-gray text-sm">次后锁定15分钟</span></div>
      <div class="form-row"><label class="form-label">操作日志保留</label><input class="input" value="180" style="width:100px"><span class="text-gray text-sm">天</span></div>
      <div class="form-row"><label class="form-label">系统日志保留</label><input class="input" value="30" style="width:100px"><span class="text-gray text-sm">天</span></div>
      <div class="form-row"><label class="form-label">默认最大文件数</label><input class="input" value="500" style="width:100px"></div>
      <button class="btn btn-primary">保存</button>
    </div></div></div>

    <script>
      function showSetTab(k){
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        event.target.classList.add('active');
        ['llm','rule','token','sys'].forEach(x=>{const el=document.getElementById('set-'+x); if(el) el.classList.toggle('hidden', x!==k)});
      }
    <\/script>
  `, [{hash:'#/settings',label:'基础设置'}]);
}

/* ============================================================
   启动
   ============================================================ */
router();
</script>
</body>
</html>
